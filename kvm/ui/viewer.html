<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Kvm screen</title>
  <style>
    :root { --bg: #000; --bar: #121214; --text: rgba(255,255,255,.92); --text2: rgba(255,255,255,.55); --accent: #ccff4d; --stroke: rgba(255,255,255,.1); }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font: 13px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; overflow: hidden; user-select: none; }
    .bar { position: fixed; top: 0; left: 0; right: 0; height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px;
      background: var(--bar); border-bottom: 1px solid var(--stroke); z-index: 2; }
    body.win .bar { padding-left: 12px; }
    .bar b { font-weight: 600; }
    .bar .st { color: var(--text2); }
    .bar .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.25); }
    .bar .dot.on { background: var(--accent); box-shadow: 0 0 8px rgba(204,255,77,.7); }
    .spacer { flex: 1; }
    button { font: inherit; color: var(--text); background: rgba(255,255,255,.08); border: 1px solid var(--stroke); border-radius: 8px;
      padding: 5px 10px; cursor: pointer; }
    button:hover { background: rgba(255,255,255,.14); }
    button.on { background: var(--accent); color: #0b0b0c; border-color: transparent; }
    .stage { position: fixed; top: 40px; left: 0; right: 0; bottom: 0; display: grid; place-items: center; }
    img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; cursor: none; -webkit-user-drag: none; }
    body.view-only img { cursor: default; }
    .msg { position: fixed; inset: 40px 0 0 0; display: grid; place-items: center; text-align: center; color: var(--text2); padding: 24px; }
    .msg b { display: block; color: var(--text); font-size: 15px; margin-bottom: 6px; }
    .hidden { display: none !important; }
    /* As another computer's extra display: full screen, the bar only while the pointer is at the top. */
    body.display .bar { transform: translateY(-100%); transition: transform .18s ease; }
    body.display.peek .bar { transform: none; }
    body.display .stage { top: 0; }
    body.display .msg { inset: 0; }
  </style>
</head>
<body>
  <div class="bar pywebview-drag-region">
    <span class="dot" id="dot"></span><b id="name">Screen</b><span class="st" id="st">Connecting…</span>
    <span class="spacer"></span>
    <button id="ctl" title="Use the mouse and keyboard on this screen">Control</button>
    <button id="cad" title="Send Ctrl+Alt+Del">Ctrl+Alt+Del</button>
    <button id="end" class="hidden" title="Stop being a display for this computer">Stop</button>
  </div>
  <div class="stage"><img id="screen" alt=""></div>
  <div class="msg" id="msg"><div><b>Waiting for the screen</b><span>It shows here as soon as the other computer sends it.</span></div></div>
  <script>
  (() => {
    'use strict';
    const qs = new URLSearchParams(location.search);
    const pid = qs.get('pid');
    const asDisplay = qs.get('display') === '1';
    const asCamera = qs.get('camera') === '1';
    if (asCamera) {
      document.getElementById('msg').querySelector('b').textContent = 'Waiting for the camera';
      if (navigator.platform.toLowerCase().startsWith('win')) {
        document.getElementById('st').title = 'Apps on this PC can use it too: pick “Kvm Camera” as the camera (Windows 11).';
      }
    }
    if (asDisplay) {
      document.body.classList.add('display');
      document.getElementById('end').classList.remove('hidden');
      document.getElementById('msg').querySelector('b').textContent = 'Waiting for the display';
      window.addEventListener('mousemove', (e) => document.body.classList.toggle('peek', e.clientY < 6 || (e.clientY < 46 && document.body.classList.contains('peek'))));
    }
    const img = document.getElementById('screen');
    const $ = (id) => document.getElementById(id);
    let api = null, view = null, control = true, url = null, moved = null, raf = 0, gotFrame = false, polling = false;
    const held = new Set();

    function frac(e) {
      const r = img.getBoundingClientRect();
      if (!r.width || !r.height) return null;
      const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
      if (x < 0 || y < 0 || x > 1 || y > 1) return null;
      return { x, y };
    }
    const canUse = () => api && control && view && view.control && view.phase === 'live';
    const send = (ev) => { if (canUse()) api.view_input(pid, ev); };

    img.addEventListener('load', () => {
      if (!gotFrame) { gotFrame = true; $('msg').classList.add('hidden'); }
    });
    img.addEventListener('error', () => { if (!polling) startPolling(); });
    function startPolling() {
      // Some web views won't play a multipart stream: ask for one picture at a time instead.
      polling = true;
      const next = () => { if (!url) return; img.src = url.replace('/view/', '/frame/') + '&after=0&t=' + Date.now(); };
      img.addEventListener('load', () => setTimeout(next, 66));
      img.addEventListener('error', () => setTimeout(next, 500));
      next();
    }

    img.addEventListener('mousemove', (e) => {
      const f = frac(e);
      if (!f) return;
      moved = f;
      if (!raf) raf = requestAnimationFrame(() => { raf = 0; if (moved) send({ k: 'abs', x: moved.x, y: moved.y }); moved = null; });
    });
    const BTN = { 0: 1, 1: 3, 2: 2, 3: 4, 4: 5 };
    img.addEventListener('mousedown', (e) => { e.preventDefault(); const f = frac(e); if (f) send({ k: 'abs', x: f.x, y: f.y }); send({ k: 'button', b: BTN[e.button] || 1, d: true }); });
    window.addEventListener('mouseup', (e) => send({ k: 'button', b: BTN[e.button] || 1, d: false }));
    img.addEventListener('contextmenu', (e) => e.preventDefault());
    img.addEventListener('wheel', (e) => {
      e.preventDefault();
      const unit = e.deltaMode === 1 ? 3 : (e.deltaMode === 2 ? 0.1 : 100);
      send({ k: 'wheel', dx: e.deltaX / unit, dy: -e.deltaY / unit });
    }, { passive: false });
    window.addEventListener('keydown', (e) => {
      if (!canUse()) return;
      e.preventDefault();
      held.add(e.code);
      send({ k: 'key', code: e.code, d: true });
    });
    window.addEventListener('keyup', (e) => {
      if (!canUse()) return;
      e.preventDefault();
      held.delete(e.code);
      send({ k: 'key', code: e.code, d: false });
    });
    window.addEventListener('blur', () => {
      // Nothing stays pressed on the other computer when this window loses focus.
      for (const c of held) send({ k: 'key', code: c, d: false });
      held.clear();
    });

    $('end').addEventListener('click', () => api.close_display(pid));
    $('ctl').addEventListener('click', () => { control = !control; render(); $('ctl').blur(); });
    $('cad').addEventListener('click', () => {
      for (const c of ['ControlLeft', 'AltLeft', 'Delete']) send({ k: 'key', code: c, d: true });
      for (const c of ['Delete', 'AltLeft', 'ControlLeft']) send({ k: 'key', code: c, d: false });
      $('cad').blur();
    });

    function render() {
      const live = view && view.phase === 'live';
      $('dot').classList.toggle('on', !!live);
      let st = 'Connecting…';
      if (view && view.phase === 'live') st = view.w ? `${view.w}×${view.h}` : 'Live';
      if (view && view.error) st = view.error;
      if (!view) st = 'Not connected';
      $('st').textContent = st;
      const can = !!(view && view.control);
      $('ctl').classList.toggle('hidden', !can);
      $('cad').classList.toggle('hidden', !(can && control));
      $('ctl').classList.toggle('on', control && can);
      document.body.classList.toggle('view-only', !(control && can));
      if (view && view.error) {
        $('msg').innerHTML = `<div><b>${view.error.replace(/[&<>]/g, '')}</b></div>`;
        $('msg').classList.remove('hidden');
      }
    }

    async function poll() {
      try {
        const s = await api.viewer_state(pid);
        view = s.view;
        const what = asDisplay ? ' display' : (asCamera ? ' camera' : '');
        if (s.name) { $('name').textContent = s.name + what; document.title = s.name + what + ' · Kvm'; }
        if (view && view.url && view.url !== url) { url = view.url; gotFrame = false; img.src = url; }
        render();
      } catch (e) { /* keep trying */ }
      setTimeout(poll, 1000);
    }

    function boot() {
      api = window.pywebview.api;
      if (navigator.platform.toLowerCase().startsWith('win')) document.body.classList.add('win');
      poll();
    }
    if (window.pywebview && window.pywebview.api) boot();
    else window.addEventListener('pywebviewready', boot);
  })();
  </script>
</body>
</html>
