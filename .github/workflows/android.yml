# Builds Kvm for Android on pull requests: the core tests (the same numbers as the desktop's
# Python, tests/test_phone.py) and the APK, kept as a downloadable artifact. Releases build it in release.yml.
name: Android

on:
  pull_request:
    paths: [android/**, VERSION, .github/workflows/android.yml]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - run: gradle -p android --no-daemon :core:test :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Kvm-Android
          path: android/app/build/outputs/apk/release/app-release.apk
